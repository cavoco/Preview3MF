name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch: {}   # allow manual runs to debug signing/notarization without cutting a tag

permissions:
  contents: write

env:
  TEAM_ID: XPBX8CKBGU

jobs:
  build-and-release:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        run: |
          # Tag pushes set a real version; manual dispatch runs use a throwaway tag.
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "TAG=${GITHUB_REF#refs/tags/}" >> "$GITHUB_ENV"
          else
            echo "TAG=dev-notarize-test" >> "$GITHUB_ENV"
          fi

      - name: Import Developer ID certificate
        env:
          CERT_P12: ${{ secrets.DEVELOPER_ID_CERT_P12 }}
          CERT_PASSWORD: ${{ secrets.DEVELOPER_ID_CERT_PASSWORD }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/build.keychain"
          KEYCHAIN_PASSWORD="$(uuidgen)"

          # Create and unlock a throwaway keychain, and put it first in the search list.
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db

          # Import the Developer ID Application cert + private key.
          echo "$CERT_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" \
            -k "$KEYCHAIN" -P "$CERT_PASSWORD" \
            -T /usr/bin/codesign -T /usr/bin/security
          rm -f "$RUNNER_TEMP/cert.p12"

          # Allow codesign to use the key without an interactive prompt.
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"

          IDENTITY=$(security find-identity -v -p codesigning "$KEYCHAIN" \
            | grep "Developer ID Application" | head -1 | awk -F'"' '{print $2}')
          echo "Signing identity: $IDENTITY"
          echo "SIGN_IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: Build universal, signed Release
        run: |
          xcodebuild \
            -scheme Preview3MF \
            -configuration Release \
            -derivedDataPath build/DerivedData \
            ARCHS="arm64 x86_64" \
            ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="$SIGN_IDENTITY" \
            DEVELOPMENT_TEAM="$TEAM_ID" \
            OTHER_CODE_SIGN_FLAGS="--timestamp --options runtime" \
            CODE_SIGN_INJECT_BASE_ENTITLEMENTS=NO \
            -quiet

      - name: Locate the built app
        run: |
          APP_PATH=$(find build/DerivedData -name "Preview3MF.app" -type d | head -1)
          echo "APP_PATH=$APP_PATH" >> "$GITHUB_ENV"
          echo "Built: $APP_PATH"
          # Sanity-check: universal binary + valid signature on the app and its extensions.
          lipo -info "$APP_PATH/Contents/MacOS/Preview3MF"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          # Notarization rejects any binary carrying the debug get-task-allow entitlement.
          # Fail fast here rather than after a slow round-trip to Apple.
          while IFS= read -r bin; do
            if codesign -d --entitlements - --xml "$bin" 2>/dev/null | grep -q "get-task-allow"; then
              echo "::error::$bin still carries com.apple.security.get-task-allow"
              exit 1
            fi
          done < <(find "$APP_PATH" -type f -perm +111 -path "*/MacOS/*")

      - name: Notarize
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          # notarytool needs a zip/dmg/pkg to submit.
          ditto -c -k --keepParent "$APP_PATH" "$RUNNER_TEMP/notarize.zip"

          # Submit and capture the submission id. notarytool submit --wait exits 0 even
          # when Apple *rejects* the build, so we must inspect the status ourselves.
          SUBMIT_JSON=$(xcrun notarytool submit "$RUNNER_TEMP/notarize.zip" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --team-id "$TEAM_ID" \
            --output-format json \
            --wait)
          echo "$SUBMIT_JSON"

          SUBMISSION_ID=$(echo "$SUBMIT_JSON" | python3 -c 'import sys,json; print(json.load(sys.stdin)["id"])')
          STATUS=$(echo "$SUBMIT_JSON" | python3 -c 'import sys,json; print(json.load(sys.stdin)["status"])')
          echo "Notarization status: $STATUS (submission $SUBMISSION_ID)"

          # Always dump Apple's per-issue log — it names the exact file + reason on rejection.
          echo "----- notarytool log -----"
          xcrun notarytool log "$SUBMISSION_ID" \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_APP_PASSWORD" \
            --team-id "$TEAM_ID" || true

          if [ "$STATUS" != "Accepted" ]; then
            echo "::error::Notarization failed with status: $STATUS"
            exit 1
          fi

      - name: Staple ticket
        run: |
          # Apple's ticket-distribution (CloudKit) can lag a few seconds behind an
          # Accepted verdict, so retry the staple until the ticket is available.
          for attempt in 1 2 3 4 5 6; do
            if xcrun stapler staple "$APP_PATH"; then
              break
            fi
            echo "Staple attempt $attempt failed (ticket not propagated yet); retrying in 20s..."
            sleep 20
          done
          xcrun stapler validate "$APP_PATH"

      - name: Zip stapled app
        run: |
          ditto -c -k --keepParent "$APP_PATH" "Preview3MF-${TAG}-universal.zip"

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          gh release create "$TAG" "Preview3MF-${TAG}-universal.zip" \
            --title "$TAG" \
            --generate-notes
        env:
          GH_TOKEN: ${{ github.token }}
